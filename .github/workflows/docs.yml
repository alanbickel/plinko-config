name: Docs

# Builds the docs site (site/) on every PR; on main, release.yml calls it and deploys the result
# to GitHub Pages.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # Both installs first: the examples are type-checked with the library's TypeScript 7, and
      # the framework recipes resolve React, Solid, and Angular types from site/node_modules.
      - run: npm ci
      - run: npm ci
        working-directory: site
      # Builds the library first: the site depends on it as "plinko-config": "file:..", so the
      # site build below imports dist/ through the package's exports, as an app would.
      - run: npm run docs:examples
      # Fails if any public export lacks a doc comment (TypeDoc validation).
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist
