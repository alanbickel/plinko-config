name: Release

# Every push to main runs CI and the docs build. When package.json's version isn't on npm yet,
# it also publishes that version (trusted publishing, with provenance), tags it, creates a GitHub
# Release, and deploys the docs to GitHub Pages. A manual run does the same, and also deploys the
# docs without a new version: use it for docs fixes between releases (it deploys main as it is).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docs:
    uses: ./.github/workflows/docs.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Publishes only a version npm doesn't have. Skips a package that isn't on npm at all: npm
      # can't trust a publisher for a package that doesn't exist, so its first version is manual.
      - id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! versions=$(npm view "$name" versions --json 2>/dev/null); then
            echo "::notice::$name is not on npm (or npm is unreachable); not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif node -e 'process.exit([].concat(JSON.parse(process.argv[1])).includes(process.argv[2]) ? 0 : 1)' "$versions" "$version"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [ci, docs, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepack builds dist/ first.
      - run: npm publish
      - run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}

  pages:
    needs: [ci, docs, publish]
    if: >-
      !cancelled() && needs.ci.result == 'success' && needs.docs.result == 'success' &&
      (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
